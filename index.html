<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Calculator</title>
	<script src="./index.js" defer></script>
	<link rel="stylesheet" href="./style.css">
</head>
<body>
	<main>
		<div class="accessories">
			<img src="https://cdn-icons-png.flaticon.com/128/18291/18291644.png" alt="brown-bear" width="80px" height="80px">
			<div class="container">
				<div class="item"></div>
				<div class="item"></div>
				<div class="item"></div>
				<div class="item"></div>
			</div>
		</div><br>
		<div class="display"></div><br>
		<div class="button-container">
			<button>1</button>
			<button>2</button>
			<button>3</button>
			<button>4</button>
			<button>5</button>
			<button>6</button>
			<button>7</button>
			<button>8</button>
			<button>9</button>
			<button>0</button>
			<button>+</button>
			<button>-</button>
			<button>x</button>
			<button>/</button>
			<button>=</button>
			<button>Clear</button>
		</div><br>
		<footer>Calculator created by <a href="https://github.com/annisaps313/calculator" target="_blank">Annisa Puspitasari</a></footer>
	</main>
</body>
</html>
